name: Publish database and website

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-database-and-website
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: windows-2025

    steps:
      - name: Check Pages deployment settings
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if (-not $env:CLOUDFLARE_API_TOKEN) { throw 'Set the CLOUDFLARE_API_TOKEN repository secret.' }
          if (-not $env:CLOUDFLARE_ACCOUNT_ID) { throw 'Set the CLOUDFLARE_ACCOUNT_ID repository variable.' }

      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          # 3.13: the SDK's pyghidra pins JPype1 1.5.2, which has no 3.14 wheel.
          python-version: "3.13"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sdk/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Show tool versions
        run: |
          python --version
          python -m pip --version
          node --version
          npm --version
          gh --version

      # The SDK dependencies are installed too: tests/sdk must run, never skip.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r sdk/requirements.txt

      - name: Run regression tests
        run: python -B -m tests

      - name: Set release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A rerun of the same dispatch should resume the same release.
          $created = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" --jq .created_at
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stamp = ([datetimeoffset]::Parse($created)).UtcDateTime.ToString('yyyyMMdd-HHmmss')
          $version = "$stamp-$($env:GITHUB_SHA.Substring(0, 7))"
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Export database and processed data
        run: python main.py

      - name: Build website
        run: |
          npm --prefix web ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix web run build

      - name: Deploy website to Cloudflare Pages
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.1 pages deploy web/dist --project-name=mhws-in-json --branch=$env:GITHUB_REF_NAME --commit-hash=$env:GITHUB_SHA

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $releaseJson = python .github/scripts/release_notes.py --format json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $release = $releaseJson | ConvertFrom-Json
          $tag = $release.tag
          $title = $release.title
          $assets = @($release.assets)
          $notes = $release.notes
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $notes | gh release edit $tag --title $title --notes-file -
          } else {
            $notes | gh release create $tag $assets --title $title --notes-file - --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
