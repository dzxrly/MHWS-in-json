name: Build database release

# Pull requests only validate (tests and a full export). Releases are published
# after a push to the default branch or a manual run on the default branch.
# Cloudflare Pages builds and deploys the website (web/) from Git pushes; here
# the same build only checks it. Releases link to the site and carry its data
# as JSON (PROCESSED_DATA), not its pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          # 3.13: the SDK's pyghidra pins JPype1 1.5.2, which has no 3.14 wheel.
          python-version: "3.13"
          check-latest: true
          cache: pip
          cache-dependency-path: |
            requirements.txt
            sdk/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Show tool versions
        run: |
          python --version
          python -m pip --version
          node --version
          npm --version
          gh --version

      # The SDK dependencies are installed too: tests/sdk must run, never skip.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r sdk/requirements.txt

      - name: Run regression tests
        run: python -B -m tests

      - name: Set release version
        shell: pwsh
        run: |
          $version = "$(Get-Date -AsUTC -Format 'yyyyMMdd-HHmmss')-$($env:GITHUB_SHA.Substring(0, 7))"
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Export database and processed data
        run: python main.py

      # web/ reads only the committed JSON in src/site_data/data (the tests
      # check it is current); no Python, SDK, EXE, IL2CPP or resource inputs.
      - name: Build website (same command as Cloudflare Pages)
        run: |
          npm --prefix web ci
          npm --prefix web run build

      - name: Publish release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $releaseJson = python .github/scripts/release_notes.py --format json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $release = $releaseJson | ConvertFrom-Json
          $tag = $release.tag
          $title = $release.title
          $assets = @($release.assets)
          $notes = $release.notes
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $notes | gh release edit $tag --title $title --notes-file -
          } else {
            $notes | gh release create $tag $assets --title $title --notes-file - --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
