name: Build database release and monster Pages

# Pull requests only validate (tests and a full export). Releases and Pages are
# published after a merge, i.e. a push to the default branch, or by a manual
# run on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  release:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14"
          check-latest: true
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Show tool versions
        run: |
          python --version
          python -m pip --version
          gh --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run regression tests
        run: python -B -m tests

      - name: Set release version
        shell: pwsh
        run: |
          $version = "$(Get-Date -AsUTC -Format 'yyyyMMdd-HHmmss')-$($env:GITHUB_SHA.Substring(0, 7))"
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV

      # Battle HTML reads only offline-extracted JSON committed under src models.
      # Do not run the offline SDK, install its native-analysis dependencies,
      # or provide EXE/IL2CPP/resource inputs to the battle HTML builder here.
      - name: Export database and processed data (battle HTML from frozen JSON)
        run: python main.py

      - name: Build monster Pages from validated processed data
        if: env.PUBLISH == 'true'
        run: python .github/scripts/build_pages.py --output .agents/pages --version "${{ env.RELEASE_VERSION }}" --repository "${{ github.repository }}"

      - name: Upload GitHub Pages artifact
        if: env.PUBLISH == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .agents/pages

      - name: Publish release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUTF8: "1"
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          $releaseJson = python .github/scripts/release_notes.py --format json
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $release = $releaseJson | ConvertFrom-Json
          $tag = $release.tag
          $title = $release.title
          $assets = @($release.assets)
          $notes = $release.notes
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $notes | gh release edit $tag --title $title --notes-file -
          } else {
            $notes | gh release create $tag $assets --title $title --notes-file - --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  deploy-pages:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy monster Pages
        id: deployment
        uses: actions/deploy-pages@v4
